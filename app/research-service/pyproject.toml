[project]
name = "zhigu-research-service"
version = "0.1.0"
description = "Internal DeerFlow research worker for Zhigu"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.12",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
harness = ["deerflow-harness"]

[tool.uv.sources]
deerflow-harness = { path = "../../references/deer-flow/backend/packages/harness", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
