name: zhigu-production
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: zhigu
      POSTGRES_DB: zhigu
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhigu -d zhigu"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  research:
    build:
      context: ../..
      dockerfile: app/research-service/Dockerfile
    environment:
      ZHIGU_DEPLOYMENT_ENVIRONMENT: production
      ZHIGU_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      ZHIGU_RESEARCH_SQLITE: /data/jobs.sqlite
      ZHIGU_GO_INTERNAL_URL: http://server:8080
      ZHIGU_RESEARCH_EXECUTOR: harness
    secrets: [internal_token]
    volumes: [research-data:/data]
    networks: [backend]
    ports: ["127.0.0.1:8091:8091"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/livez')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  futures:
    build:
      context: ../..
      dockerfile: app/futures-service/Dockerfile
    environment:
      ZHIGU_DEPLOYMENT_ENVIRONMENT: production
      FUTURES_SERVICE_TOKEN_FILE: /run/secrets/futures_token
      FUTURES_GO_BASE_URL: http://server:8080
      FUTURES_STORAGE_DIR: /documents
    secrets: [futures_token]
    volumes: [futures-data:/data, futures-documents:/documents]
    networks: [backend]
    ports: ["127.0.0.1:8092:8092"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/livez')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      ZHIGU_DEPLOYMENT_ENVIRONMENT: production
      ZHIGU_PUBLIC_ORIGIN: ${ZHIGU_PUBLIC_ORIGIN:?set ZHIGU_PUBLIC_ORIGIN}
      ZHIGU_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
      ZHIGU_HTTP_ADDR: ":8080"
      ZHIGU_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      ZHIGU_RESEARCH_URL: http://research:8091
      ZHIGU_RESEARCH_ENABLED: "true"
      ZHIGU_RESEARCH_EXECUTOR: harness
      ZHIGU_RESEARCH_DOCUMENT_DIR: /data/documents
      ZHIGU_RESEARCH_STORAGE_DIR: /data/storage
      ZHIGU_FUTURES_ENABLED: "true"
      FUTURES_WORKER_URL: http://futures:8092
      FUTURES_SERVICE_TOKEN_FILE: /run/secrets/futures_token
      ZHIGU_FUTURES_STORAGE_DIR: /futures-documents
      ZHIGU_JWT_SECRET_FILE: /run/secrets/jwt_secret
      ZHIGU_MASTER_KEY_FILE: /run/secrets/master_key
      ZHIGU_SESSION_KEYS_FILE: /run/secrets/session_keys
      ZHIGU_DATA_PROVENANCE: real
      ZHIGU_OPERATION_MODE: read_only
      ZHIGU_FUTURES_MODE: read_only
    secrets: [postgres_dsn, internal_token, futures_token, jwt_secret, session_keys, master_key]
    volumes: [research-data:/data, futures-documents:/futures-documents]
    ports: ["127.0.0.1:8080:8080"]
    networks: [frontend, backend]
    depends_on:
      postgres: {condition: service_healthy}
      research: {condition: service_healthy}
      futures: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/livez || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    pids_limit: 512
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_INTEL_ENABLED: "true"
        VITE_FUTURES_ENABLED: "true"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ZHIGU_TLS_CERT_DIR:?set ZHIGU_TLS_CERT_DIR}:/etc/nginx/certs:ro
    ports: ["80:8080", "443:8443"]
    networks: [frontend]
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/livez"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

secrets:
  postgres_password: {file: ./secrets/postgres_password}
  postgres_dsn: {file: ./secrets/postgres_dsn}
  internal_token: {file: ./secrets/internal_token}
  futures_token: {file: ./secrets/futures_token}
  jwt_secret: {file: ./secrets/jwt_secret}
  session_keys: {file: ./secrets/session_keys}
  master_key: {file: ./secrets/master_key}

networks:
  frontend: {}
  backend: {internal: true}

volumes:
  postgres-data: {}
  research-data: {}
  futures-data: {}
  futures-documents: {}
