services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zhigu
      POSTGRES_PASSWORD: zhigu
      POSTGRES_DB: zhigu
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhigu"]
      interval: 5s
      timeout: 5s
      retries: 10
  research:
    image: python:3.12
    working_dir: /work/app/research-service
    command: bash -lc "pip install -q uv && uv sync --frozen --no-dev && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8091"
    environment:
      ZHIGU_INTERNAL_TOKEN: zhigu-internal-dev
      ZHIGU_RESEARCH_SQLITE: /data/jobs.sqlite
      ZHIGU_GO_INTERNAL_URL: http://server:8080
      ZHIGU_RESEARCH_EXECUTOR: fixture
      UV_PROJECT_ENVIRONMENT: /opt/zhigu-venv
    volumes:
      - ../..:/work
      - researchdata:/data
    expose: ["8091"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    image: golang:1.24
    working_dir: /work/app/server
    command: bash -lc "export GOTOOLCHAIN=local && go run ."
    environment:
      ZHIGU_POSTGRES_DSN: host=postgres user=zhigu password=zhigu dbname=zhigu port=5432 sslmode=disable TimeZone=UTC
      ZHIGU_HTTP_ADDR: ":8080"
      ZHIGU_INTERNAL_TOKEN: zhigu-internal-dev
      ZHIGU_RESEARCH_URL: http://research:8091
      ZHIGU_RESEARCH_EXECUTOR: fixture
      ZHIGU_INTEL_ENABLED: "true"
      ZHIGU_INTEL_MODE: demo
      ZHIGU_INTEL_PROVIDERS: fixture
      ZHIGU_INTEL_COOKIE_SECRET: ${ZHIGU_INTEL_COOKIE_SECRET:?set ZHIGU_INTEL_COOKIE_SECRET}
      ZHIGU_INTEL_PUBLIC_ORIGIN: http://localhost:5173
      ZHIGU_INTEL_DAILY_TOKEN_LIMIT: "200000"
    volumes: ["../..:/work"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      research:
        condition: service_healthy
  web:
    image: node:22
    working_dir: /work/app/web
    command: bash -lc "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes: ["../..:/work"]
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [server]
    environment:
      CHOKIDAR_USEPOLLING: "1"
      ZHIGU_API_PROXY: http://server:8080
      VITE_INTEL_ENABLED: "true"
volumes:
  pgdata:
  researchdata:
